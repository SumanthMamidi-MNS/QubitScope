<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .section-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .gate-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
    .gate-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .math-sym { font-family: "Cambria Math", "Times New Roman", "KaTeX_Math", serif; font-size: 22px; font-style: italic; }
    .mat-entry { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; fill: #f8fafc; text-anchor: middle; }
    .mat-bracket { font-family: "Courier New", Courier, monospace; font-size: 38px; fill: #64748b; font-weight: 200; }
    .rot-entry { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; fill: #f8fafc; text-anchor: middle; }
    .rot-bracket { font-family: "Courier New", Courier, monospace; font-size: 42px; fill: #64748b; font-weight: 200; }
  </style>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title Banner -->
  <g transform="translate(36, 40)">
    <circle cx="8" cy="8" r="5" fill="#a855f7" />
    <text x="24" y="14" class="title-main">Complete Unitary Quantum Gate Matrix Library</text>
    <text x="24" y="34" class="subtitle">Normalized 2×2 unitary transformations (U†U = I) preserving statevector length on the Bloch sphere</text>
  </g>

  <!-- SECTION 1: PAULI GATES -->
  <g transform="translate(36, 95)">
    <text x="0" y="0" class="section-tag" fill="#38bdf8">I. Fundamental Pauli Operators (180° Rotations)</text>

    <!-- Pauli-X -->
    <g transform="translate(0, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="125" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="28" class="gate-title" fill="#38bdf8">Pauli-X (Bit-Flip)</text>
      <text x="18" y="44" class="gate-desc">180° rotation around X-axis (|0⟩ ↔ |1⟩)</text>
      <!-- Matrix -->
      <g transform="translate(45, 62)">
        <text x="0" y="35" class="math-sym" fill="#38bdf8">X =</text>
        <text x="50" y="36" class="mat-bracket">[</text>
        <text x="75" y="24" class="mat-entry">0</text>
        <text x="110" y="24" class="mat-entry">1</text>
        <text x="75" y="46" class="mat-entry">1</text>
        <text x="110" y="46" class="mat-entry">0</text>
        <text x="125" y="36" class="mat-bracket">]</text>
      </g>
    </g>

    <!-- Pauli-Y -->
    <g transform="translate(304, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="125" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="28" class="gate-title" fill="#38bdf8">Pauli-Y (Bit &amp; Phase)</text>
      <text x="18" y="44" class="gate-desc">180° rotation around Y-axis</text>
      <!-- Matrix -->
      <g transform="translate(45, 62)">
        <text x="0" y="35" class="math-sym" fill="#38bdf8">Y =</text>
        <text x="50" y="36" class="mat-bracket">[</text>
        <text x="75" y="24" class="mat-entry">0</text>
        <text x="115" y="24" class="mat-entry" fill="#f43f5e">−i</text>
        <text x="75" y="46" class="mat-entry" fill="#38bdf8">i</text>
        <text x="115" y="46" class="mat-entry">0</text>
        <text x="130" y="36" class="mat-bracket">]</text>
      </g>
    </g>

    <!-- Pauli-Z -->
    <g transform="translate(608, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="125" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="28" class="gate-title" fill="#38bdf8">Pauli-Z (Phase-Flip)</text>
      <text x="18" y="44" class="gate-desc">180° rotation around Z-axis (|1⟩ → −|1⟩)</text>
      <!-- Matrix -->
      <g transform="translate(45, 62)">
        <text x="0" y="35" class="math-sym" fill="#38bdf8">Z =</text>
        <text x="50" y="36" class="mat-bracket">[</text>
        <text x="75" y="24" class="mat-entry">1</text>
        <text x="115" y="24" class="mat-entry">0</text>
        <text x="75" y="46" class="mat-entry">0</text>
        <text x="115" y="46" class="mat-entry" fill="#f43f5e">−1</text>
        <text x="130" y="36" class="mat-bracket">]</text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: SUPERPOSITION & PHASE GATES -->
  <g transform="translate(36, 265)">
    <text x="0" y="0" class="section-tag" fill="#c084fc">II. Superposition &amp; Phase Gates</text>

    <!-- Hadamard -->
    <g transform="translate(0, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="125" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="28" class="gate-title" fill="#c084fc">Hadamard (H)</text>
      <text x="18" y="44" class="gate-desc">Maps basis poles to equator superposition |+⟩</text>
      <!-- Matrix -->
      <g transform="translate(15, 62)">
        <text x="0" y="35" class="math-sym" fill="#c084fc">H = 1/√2</text>
        <text x="80" y="36" class="mat-bracket">[</text>
        <text x="105" y="24" class="mat-entry">1</text>
        <text x="135" y="24" class="mat-entry">1</text>
        <text x="105" y="46" class="mat-entry">1</text>
        <text x="135" y="46" class="mat-entry" fill="#f43f5e">−1</text>
        <text x="150" y="36" class="mat-bracket">]</text>
      </g>
    </g>

    <!-- Phase (S) -->
    <g transform="translate(304, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="125" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="28" class="gate-title" fill="#c084fc">Phase Gate (S = √Z)</text>
      <text x="18" y="44" class="gate-desc">90° rotation around Z-axis (|1⟩ → i|1⟩)</text>
      <!-- Matrix -->
      <g transform="translate(45, 62)">
        <text x="0" y="35" class="math-sym" fill="#c084fc">S =</text>
        <text x="50" y="36" class="mat-bracket">[</text>
        <text x="75" y="24" class="mat-entry">1</text>
        <text x="115" y="24" class="mat-entry">0</text>
        <text x="75" y="46" class="mat-entry">0</text>
        <text x="115" y="46" class="mat-entry" fill="#38bdf8">i</text>
        <text x="130" y="36" class="mat-bracket">]</text>
      </g>
    </g>

    <!-- T Gate -->
    <g transform="translate(608, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="125" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="28" class="gate-title" fill="#c084fc">π/8 Gate (T = √S)</text>
      <text x="18" y="44" class="gate-desc">45° rotation around Z-axis (|1⟩ → e^(iπ/4)|1⟩)</text>
      <!-- Matrix -->
      <g transform="translate(35, 62)">
        <text x="0" y="35" class="math-sym" fill="#c084fc">T =</text>
        <text x="45" y="36" class="mat-bracket">[</text>
        <text x="70" y="24" class="mat-entry">1</text>
        <text x="120" y="24" class="mat-entry">0</text>
        <text x="70" y="46" class="mat-entry">0</text>
        <text x="120" y="46" class="rot-entry" fill="#34d399">e^(iπ/4)</text>
        <text x="155" y="36" class="mat-bracket">]</text>
      </g>
    </g>
  </g>

  <!-- SECTION 3: PARAMETERIZED CONTINUOUS ROTATIONS -->
  <g transform="translate(36, 435)">
    <text x="0" y="0" class="section-tag" fill="#34d399">III. Parameterized Continuous Rotations (Arbitrary Angle θ)</text>

    <!-- Rx(theta) -->
    <g transform="translate(0, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="135" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="26" class="gate-title" fill="#34d399">Rotation-X: Rx(θ)</text>
      <text x="18" y="42" class="gate-desc">Arbitrary rotation angle θ around X-axis</text>
      <!-- Matrix -->
      <g transform="translate(10, 58)">
        <text x="0" y="38" class="rot-bracket">[</text>
        <text x="50" y="26" class="rot-entry">cos(θ/2)</text>
        <text x="110" y="26" class="rot-entry" fill="#f43f5e">−i sin(θ/2)</text>
        <text x="50" y="52" class="rot-entry" fill="#f43f5e">−i sin(θ/2)</text>
        <text x="110" y="52" class="rot-entry">cos(θ/2)</text>
        <text x="145" y="38" class="rot-bracket">]</text>
      </g>
    </g>

    <!-- Ry(theta) -->
    <g transform="translate(304, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="135" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="26" class="gate-title" fill="#34d399">Rotation-Y: Ry(θ)</text>
      <text x="18" y="42" class="gate-desc">Arbitrary rotation angle θ around Y-axis</text>
      <!-- Matrix -->
      <g transform="translate(10, 58)">
        <text x="0" y="38" class="rot-bracket">[</text>
        <text x="50" y="26" class="rot-entry">cos(θ/2)</text>
        <text x="110" y="26" class="rot-entry" fill="#f43f5e">−sin(θ/2)</text>
        <text x="50" y="52" class="rot-entry" fill="#38bdf8">sin(θ/2)</text>
        <text x="110" y="52" class="rot-entry">cos(θ/2)</text>
        <text x="145" y="38" class="rot-bracket">]</text>
      </g>
    </g>

    <!-- Rz(theta) -->
    <g transform="translate(608, 15)" filter="url(#cardShadow2)">
      <rect width="280" height="135" rx="10" fill="#0b1329" stroke="#1e293b" />
      <text x="18" y="26" class="gate-title" fill="#34d399">Rotation-Z: Rz(θ)</text>
      <text x="18" y="42" class="gate-desc">Continuous phase shift θ around Z-axis</text>
      <!-- Matrix -->
      <g transform="translate(15, 58)">
        <text x="0" y="38" class="rot-bracket">[</text>
        <text x="50" y="26" class="rot-entry" fill="#38bdf8">e^(−iθ/2)</text>
        <text x="105" y="26" class="rot-entry">0</text>
        <text x="50" y="52" class="rot-entry">0</text>
        <text x="105" y="52" class="rot-entry" fill="#34d399">e^(iθ/2)</text>
        <text x="135" y="38" class="rot-bracket">]</text>
      </g>
    </g>
  </g>
</svg>
