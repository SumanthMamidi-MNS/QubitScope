<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .card-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .math-expr { font-family: "Cambria Math", "Times New Roman", "KaTeX_Math", serif; font-size: 20px; font-style: italic; }
    .math-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-style: normal; fill: #94a3b8; }
    .math-box { font-family: "Cambria Math", "Times New Roman", serif; font-size: 17px; fill: #e2e8f0; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="460" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title Banner -->
  <g transform="translate(36, 42)">
    <circle cx="8" cy="8" r="5" fill="#38bdf8" />
    <text x="24" y="14" class="title-main">Single-Qubit Statevector &amp; Bloch Projection</text>
    <text x="24" y="34" class="subtitle">Exact mapping from two-dimensional complex Hilbert space ℂ² to the 3D unit sphere surface S²</text>
  </g>

  <!-- CARD 1: Statevector & Normalization -->
  <g transform="translate(36, 105)" filter="url(#cardShadow)">
    <rect width="425" height="155" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <!-- Header -->
    <rect x="20" y="16" width="6" height="14" rx="3" fill="#38bdf8" />
    <text x="34" y="28" class="card-header" fill="#38bdf8">1. Pure State &amp; Amplitudes</text>
    <rect x="310" y="14" width="95" height="20" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
    <text x="357" y="28" text-anchor="middle" class="badge-text" fill="#7dd3fc">HILBERT SPACE</text>

    <!-- Formula -->
    <text x="25" y="75" class="math-expr" fill="#f8fafc">
      |ψ⟩ = α |0⟩ + β |1⟩ = <tspan fill="#38bdf8">[ α, β ]ᵀ</tspan>
    </text>
    <text x="25" y="105" class="math-sub">
      where <tspan font-family="Cambria Math" font-style="italic" fill="#e2e8f0">α, β ∈ ℂ</tspan> represent complex probability amplitudes.
    </text>
    <!-- Normalization Pill -->
    <rect x="25" y="118" width="375" height="26" rx="6" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="212" y="136" text-anchor="middle" class="math-box">
      Born Normalization Constraint: <tspan font-weight="bold" fill="#38bdf8">|α|² + |β|² = 1</tspan>
    </text>
  </g>

  <!-- CARD 2: Spherical Parameterization -->
  <g transform="translate(499, 105)" filter="url(#cardShadow)">
    <rect width="425" height="155" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <!-- Header -->
    <rect x="20" y="16" width="6" height="14" rx="3" fill="#c084fc" />
    <text x="34" y="28" class="card-header" fill="#c084fc">2. Spherical Euler Angles</text>
    <rect x="310" y="14" width="95" height="20" rx="10" fill="#3b0764" stroke="#7e22ce" stroke-width="0.8" />
    <text x="357" y="28" text-anchor="middle" class="badge-text" fill="#d8b4fe">BLOCH SPHERE</text>

    <!-- Formula -->
    <text x="25" y="75" class="math-expr" fill="#f8fafc">
      |ψ⟩ = cos(<tspan fill="#c084fc">θ/2</tspan>)|0⟩ + e<tspan dy="-6" font-size="14">i<tspan fill="#34d399">ϕ</tspan></tspan><tspan dy="6">sin(</tspan><tspan fill="#c084fc">θ/2</tspan>)|1⟩
    </text>
    <text x="25" y="105" class="math-sub">
      Polar inclination <tspan font-family="Cambria Math" font-style="italic" fill="#c084fc">θ ∈ [0, π]</tspan> controls the probability distribution.
    </text>
    <!-- Phase Note -->
    <rect x="25" y="118" width="375" height="26" rx="6" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="212" y="136" text-anchor="middle" class="math-box">
      Azimuthal relative phase: <tspan font-weight="bold" fill="#34d399">ϕ ∈ [0, 2π)</tspan> (Equatorial Phase)
    </text>
  </g>

  <!-- CARD 3: Cartesian Coordinates & Pauli Expectation Values -->
  <g transform="translate(36, 280)" filter="url(#cardShadow)">
    <rect width="888" height="150" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <!-- Header -->
    <rect x="20" y="16" width="6" height="14" rx="3" fill="#34d399" />
    <text x="34" y="28" class="card-header" fill="#34d399">3. Cartesian Coordinates &amp; Pauli Expectation Values</text>
    <rect x="735" y="14" width="135" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
    <text x="802" y="28" text-anchor="middle" class="badge-text" fill="#6ee7b7">PAULI OBSERVABLES</text>

    <!-- 3 Coordinate Columns -->
    <g transform="translate(25, 45)">
      <!-- X Coordinate -->
      <rect x="0" y="8" width="268" height="82" rx="8" fill="#020617" stroke="#1e293b" />
      <text x="16" y="32" class="math-expr" fill="#38bdf8">x = sin θ cos ϕ</text>
      <text x="16" y="58" class="math-box" fill="#94a3b8">= 2 Re(α*β)</text>
      <text x="16" y="80" class="math-box" fill="#f8fafc" font-weight="bold">= ⟨ψ | X | ψ⟩</text>

      <!-- Y Coordinate -->
      <rect x="288" y="8" width="268" height="82" rx="8" fill="#020617" stroke="#1e293b" />
      <text x="304" y="32" class="math-expr" fill="#c084fc">y = sin θ sin ϕ</text>
      <text x="304" y="58" class="math-box" fill="#94a3b8">= 2 Im(α*β)</text>
      <text x="304" y="80" class="math-box" fill="#f8fafc" font-weight="bold">= ⟨ψ | Y | ψ⟩</text>

      <!-- Z Coordinate -->
      <rect x="576" y="8" width="262" height="82" rx="8" fill="#020617" stroke="#1e293b" />
      <text x="592" y="32" class="math-expr" fill="#34d399">z = cos θ</text>
      <text x="592" y="58" class="math-box" fill="#94a3b8">= |α|² − |β|²</text>
      <text x="592" y="80" class="math-box" fill="#f8fafc" font-weight="bold">= ⟨ψ | Z | ψ⟩</text>
    </g>
  </g>
</svg>
